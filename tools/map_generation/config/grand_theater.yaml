# Grand Theater multi-region expansion config
# See docs/MAP_MULTI_THEATER_EXPANSION.md

name: grand_theater_v1
target_total_min: 700
target_total_max: 900
sea_share_min: 0.12
sea_share_max: 0.30

island_viability:
  # Canvas area units (polygon area after densify; relative to current map scale)
  min_area_micro_exclude: 80.0      # below: merge / do not author as province
  min_area_airfield: 180.0          # small airstrip possible
  min_area_port: 320.0              # small port + limited infra
  min_area_full_facilities: 700.0   # multi-slot factories + multi sites
  critical_micros:                  # always keep even if small
    - malta
    - gibraltar
    - midway
    - wake
    - diego_garcia

theaters:
  europe_core:
    priority: 0
    land_target: 460
    sea_target: 70
    density: high
  mena:
    priority: 0
    land_target: 100
    sea_target: 25
    density: high
  north_africa:
    priority: 1
    land_target: 50
    sea_target: 15
    density: medium
  far_east_stub:
    priority: 1
    land_target: 40
    sea_target: 30
    density: medium
  blue_water:
    priority: 0
    land_target: 0
    sea_target: 50
    density: low

